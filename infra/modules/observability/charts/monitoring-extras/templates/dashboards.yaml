{{- range $name, $d := .Values.dashboards }}
{{- if $d.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $name }}
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  {{ $d.file }}: |
    {{- $.Files.Get (printf "dashboards/%s" $d.file) | nindent 4 }}
---
{{- end }}
{{- end }}
